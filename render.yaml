databases:
  - name: signeddeals-db
    databaseName: agentdb
    user: agentmarket
    plan: starter

services:
  - type: web
    name: signeddeals-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signeddeals-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PLATFORM_PRIVATE_KEY_B64
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PLATFORM_FEE_PCT
        value: "0.025"
      - key: PYTHON_VERSION
        value: 3.11.0
